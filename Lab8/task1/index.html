<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №8 — Список избранных книг</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📚 Избранные книги</h1>
        
        <!-- Форма добавления книги -->
        <div class="form-group">
            <input type="text" id="bookTitle" placeholder="Название книги">
            <input type="text" id="bookAuthor" placeholder="Автор">
            <button id="addBtn">Добавить в избранное</button>
        </div>

        <!-- Список книг -->
        <ul id="bookList"></ul>
    </div>

    <script src="app.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список покупок</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 60px auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        #itemInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 15px;
        }

        #addButton {
            background-color: #3498db;
            color: white;
        }

        #addButton:hover {
            background-color: #2980b9;
        }

        #shoppingList {
            margin-top: 25px;
            padding: 0;
            list-style: none;
        }

        #shoppingList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            background-color: #ecf0f1;
            border-radius: 8px;
        }

        .delete-button {
            background-color: #e74c3c;
            color: white;
            padding: 7px 12px;
        }

        .delete-button:hover {
            background-color: #c0392b;
        }

        #clearButton {
            width: 100%;
            margin-top: 15px;
            background-color: #95a5a6;
            color: white;
        }

        #clearButton:hover {
            background-color: #7f8c8d;
        }

        #counter {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            color: #34495e;
        }

        #message {
            text-align: center;
            min-height: 20px;
            margin-top: 10px;
            color: #e74c3c;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Список покупок</h1>

        <div class="input-area">
            <input
                type="text"
                id="itemInput"
                placeholder="Введите название товара"
            >

            <button id="addButton">Добавить</button>
        </div>

        <p id="message"></p>

        <ul id="shoppingList"></ul>

        <button id="clearButton">Очистить список</button>

        <div id="counter">
            Всего товаров: 0
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
